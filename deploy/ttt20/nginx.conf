# TicTacToe 2.0 on REG.RU 1 — frontend + isolated Socket.IO container.
server {
    listen 80;
    listen [::]:80;
    server_name ttt20.peerivo.net;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ttt20.peerivo.net/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://ttt20.peerivo.net$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ttt20.peerivo.net;
    root /var/www/ttt20.peerivo.net/public;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/ttt20.peerivo.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ttt20.peerivo.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3530;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
    location = /health {
        proxy_pass http://127.0.0.1:3530/health;
        proxy_set_header Host $host;
    }
    location ^~ /.git/ { return 403; }
    location ^~ /server/ { return 403; }
    location = /server/game-rules.js { try_files $uri =403; }
    location / { try_files $uri $uri/ /index.html; }
}
