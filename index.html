<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Крестики-Нолики 2.0</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        [hidden] { display: none !important; }

        :root {
            color-scheme: dark;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: max(16px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
            overflow-x: hidden;
            color: #fff;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        h1 {
            margin-bottom: 14px;
            text-align: center;
            font-size: clamp(22px, 5vw, 30px);
        }

        button, input { font: inherit; }

        .menu, .form-panel {
            width: min(92vw, 520px);
            text-align: center;
        }

        .menu {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .form-panel {
            padding: 14px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
        }

        .room-code {
            margin: 8px 0 2px;
            color: #ffe36e;
            font-size: clamp(28px, 8vw, 40px);
            letter-spacing: 0.14em;
        }

        .helper-text {
            margin: 8px 0 12px;
            opacity: 0.9;
        }

        .room-input {
            width: min(280px, 100%);
            padding: 12px 14px;
            border: 0;
            border-radius: 10px;
            outline: none;
            text-align: center;
            text-transform: uppercase;
            color: #222;
            background: #fff;
            font-size: 20px;
            letter-spacing: 0.18em;
        }

        .action-btn {
            margin: 8px 4px 0;
            padding: 12px 22px;
            border: 0;
            border-radius: 999px;
            cursor: pointer;
            color: #5e63cc;
            background: #fff;
            font-weight: 700;
            box-shadow: 0 5px 16px rgba(0, 0, 0, 0.2);
            transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
        }

        .action-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 7px 20px rgba(0, 0, 0, 0.25);
        }

        .action-btn.secondary {
            color: #fff;
            background: rgba(255, 255, 255, 0.2);
        }

        .action-btn:disabled {
            cursor: not-allowed;
            opacity: 0.5;
            transform: none;
        }

        #connectionStatus {
            width: min(92vw, 520px);
            min-height: 22px;
            margin: 10px 0;
            text-align: center;
            font-size: 14px;
        }

        #gameContainer { width: min(94vw, 540px); }

        .game-info {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 10px;
        }

        .player-turn {
            padding: 10px 12px;
            border-radius: 12px;
            text-align: center;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(10px);
        }

        .board-container {
            width: 100%;
            padding: clamp(7px, 2vw, 14px);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 36px rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(10px);
        }

        .big-board {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: clamp(5px, 1.6vw, 10px);
            width: 100%;
            aspect-ratio: 1;
        }

        .small-board {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            grid-template-rows: repeat(3, minmax(0, 1fr));
            gap: 2px;
            min-width: 0;
            min-height: 0;
            padding: 2px;
            border-radius: 9px;
            background: rgba(255, 255, 255, 0.28);
            transition: box-shadow 0.2s ease, opacity 0.2s ease, background 0.2s ease;
        }

        .small-board.won-x { background: rgba(231, 76, 60, 0.6); }
        .small-board.won-o { background: rgba(52, 152, 219, 0.6); }
        .small-board.draw { background: rgba(149, 165, 166, 0.55); }

        .small-board.active-board {
            box-shadow: 0 0 0 2px rgba(255, 232, 80, 0.95), 0 0 18px rgba(255, 232, 80, 0.8);
        }

        .cell {
            display: flex;
            min-width: 0;
            min-height: 0;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
            color: #333;
            background: rgba(255, 255, 255, 0.94);
            font-size: clamp(14px, 5.5vw, 25px);
            font-weight: 800;
            transition: transform 0.12s ease, background 0.12s ease, opacity 0.12s ease;
        }

        .cell:hover:not(.taken):not(.disabled) {
            transform: scale(1.04);
            background: #fff;
        }

        .cell.x { color: #d9362b; }
        .cell.o { color: #2777bd; }

        .cell.taken, .cell.disabled { cursor: default; }
        .cell.disabled:not(.taken) { opacity: 0.38; }

        .message {
            min-height: 34px;
            margin-top: 12px;
            text-align: center;
            font-size: clamp(17px, 4.5vw, 22px);
            font-weight: 800;
        }

        .game-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 4px;
        }

        #confettiCanvas {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        @media (max-width: 420px) {
            body { justify-content: flex-start; }
            .game-info { font-size: 14px; }
            .action-btn { padding: 11px 18px; }
        }
    </style>
</head>
<body>
    <h1>🎮 Крестики-Нолики 2.0</h1>

    <div id="mainMenu" class="menu">
        <button class="action-btn" type="button" onclick="startLocalGame()">📱 На одном устройстве</button>
        <button class="action-btn" type="button" onclick="showMultiplayerMenu()">🌐 Онлайн игра</button>
    </div>

    <div id="multiplayerMenu" class="menu" hidden>
        <button class="action-btn" type="button" onclick="showCreateGame()">🆕 Создать комнату</button>
        <button class="action-btn" type="button" onclick="showJoinGame()">🎮 Войти в комнату</button>
        <button class="action-btn secondary" type="button" onclick="backToMainMenu()">↩️ Назад</button>
    </div>

    <div id="createGameContainer" class="form-panel" hidden>
        <div>Ваш код игры</div>
        <div id="gameCodeDisplay" class="room-code"></div>
        <div class="helper-text">Отправьте код второму игроку. Игра начнётся автоматически после входа.</div>
        <button class="action-btn" type="button" onclick="copyGameCode()">📋 Копировать код</button>
        <button class="action-btn secondary" type="button" onclick="cancelGame()">❌ Отмена</button>
    </div>

    <div id="joinGameContainer" class="form-panel" hidden>
        <input id="roomCodeInput" class="room-input" type="text" inputmode="text" autocomplete="off" maxlength="6" placeholder="КОД ИГРЫ">
        <div>
            <button class="action-btn" type="button" onclick="joinGame()">🎮 Войти</button>
            <button class="action-btn secondary" type="button" onclick="cancelJoin()">❌ Отмена</button>
        </div>
    </div>

    <div id="connectionStatus" aria-live="polite"></div>

    <div id="gameContainer" hidden>
        <div class="game-info">
            <div class="player-turn">Ход: <strong id="currentPlayer">X</strong></div>
            <div class="player-turn">Следующее поле: <strong id="nextBoard">Любое</strong></div>
        </div>

        <div class="board-container">
            <div id="bigBoard" class="big-board" aria-label="Игровое поле 9 на 9"></div>
        </div>

        <div id="message" class="message" aria-live="polite"></div>

        <div class="game-actions">
            <button id="restartBtn" class="action-btn" type="button" onclick="restartGame()">🔄 Новая игра</button>
            <button id="exitGameBtn" class="action-btn secondary" type="button" onclick="exitGame()">↩️ В меню</button>
        </div>
    </div>

    <canvas id="confettiCanvas"></canvas>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <script src="game-rules.js"></script>
    <script src="app.js"></script>
</body>
</html>
